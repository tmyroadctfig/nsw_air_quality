name: Validate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  hacs:
    runs-on: ubuntu-latest

    steps:
    - name: HACS validation
      uses: hacs/action@main
      with:
        category: integration

  hassfest:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Hassfest validation
      uses: home-assistant/actions/hassfest@master
